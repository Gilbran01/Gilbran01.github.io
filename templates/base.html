<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site_description }}{% endblock %}">
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --card:#fff; --accent:#e8590c; --muted:#666; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 24px 16px; text-align:center; border-bottom: 1px solid #eee; background:#fff; }
  header h1 { margin:0; font-size: 1.6rem; }
  header p { margin:6px 0 0; color: var(--muted); font-size: 0.95rem; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:16px; }
  .card { background: var(--card); border:1px solid #eee; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; background:#f0f0f0; }
  .card .body { padding:12px; flex:1; display:flex; flex-direction:column; gap:8px; }
  .card h3 { margin:0; font-size:1rem; }
  .price { color: var(--accent); font-weight:700; font-size:1.1rem; }
  .btn { display:inline-block; text-align:center; background: var(--accent); color:#fff; text-decoration:none; padding:10px 14px; border-radius:8px; font-weight:600; margin-top:auto; }
  footer { text-align:center; padding:24px 16px; color: var(--muted); font-size:0.85rem; }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>{{ site_title }}</h1>
  <p>{{ site_description }}</p>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>Este site contem links de afiliado. Podemos receber comissao por compras feitas atraves deles, sem custo adicional para voce.</p>
</footer>
</body>
</html>
